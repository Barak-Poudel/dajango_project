{% extends 'base.html' %}

{% block content %}

<div class="card">

<img src="{{ room.image.url }}"
     class="card-img-top">

<div class="card-body">

<h2>{{ room.title }}</h2>

<p>
    <strong>Location:</strong>
    {{ room.location }}
</p>

<p>
    <strong>Rent:</strong>
    Rs. {{ room.rent }}
</p>

<p>
    <strong>Description:</strong><br>
    {{ room.description }}
</p>

<p>
    <strong>Contact:</strong>
    {{ room.contact_number }}
</p>

<a href="https://www.google.com/maps/search/{{ room.location }}"
   target="_blank"
   class="btn btn-success">
    View on Google Maps
</a>

</div>

</div>

{% endblock %}
