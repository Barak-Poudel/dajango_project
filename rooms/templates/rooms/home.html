{% extends 'base.html' %}

{% block content %}

<h1 class="text-white">Available Rooms</h1>

<form method="GET" class="row mb-4">

    <div class="col-md-5">
        <input type="text"
               name="location"
               placeholder="Location"
               class="form-control">
    </div>

    <div class="col-md-5">
        <input type="number"
               name="max_rent"
               placeholder="Maximum Rent"
               class="form-control">
    </div>

    <div class="col-md-2">
        <button class="btn btn-primary w-100">
            Search
        </button>
    </div>

</form>

<div class="row">

{% for room in rooms %}

<div class="col-md-4 mb-4">

<div class="card h-100">

<img src="{{ room.image.url }}"
     class="card-img-top"
     height="250">

<div class="card-body">

<h5>{{ room.title }}</h5>

<p>
    {{ room.location }}
</p>

<p>
    Rs. {{ room.rent }}
</p>

<a href="{% url 'room_detail' room.id %}"
   class="btn btn-primary">
   View Details
</a>

</div>
</div>
</div>

{% endfor %}

</div>

{% endblock %}
