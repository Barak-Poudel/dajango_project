<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RentSmart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    margin:0;
    background:
    linear-gradient(
    135deg,
    #0f172a,
    #172554,
    #312e81);
    background-size:400% 400%;
    animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.auth-wrapper{
    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.auth-card{
    width:100%;
    max-width:520px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:30px;

    padding:50px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.35);
}

.logo-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

.logo-square{
    width:60px;
    height:60px;
    border-radius:18px;

    background:
    linear-gradient(
    135deg,
    #60a5fa,
    #4f46e5);

    position:relative;

    margin-bottom:15px;
}

.logo-square::before{
    content:'';

    position:absolute;

    width:24px;
    height:24px;

    background:white;

    border-radius:8px;

    top:18px;
    left:18px;
}

.logo-container h1{
    color:white;
    font-weight:700;
    margin:0;
}

.auth-card h2{
    text-align:center;
    color:white;
    font-weight:700;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#d1d5db;
    margin-bottom:35px;
}

label{
    color:white;
    margin-bottom:8px;
    display:block;
    font-weight:500;
}

.form-control{
    height:55px;
    border-radius:14px;
    border:none;
}

.form-control:focus{
    box-shadow:
    0 0 0 4px rgba(99,102,241,.25);
}

.auth-btn{
    border-radius:14px;
    height:55px;
    font-weight:600;
    font-size:16px;
}

.auth-footer{
    margin-top:25px;
    text-align:center;
    color:white;
}

.auth-footer a{
    text-decoration:none;
    color:#93c5fd;
}

.auth-footer a:hover{
    color:white;
}

.fade-up{
    animation:fadeUp .7s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

{% block content %}
{% endblock %}

</body>
</html>
